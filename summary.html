<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    // 這一頁「載入當下」有沒有已經被某個 SW 控制——只有原本就有在
    // 控制、後來換了一顆新的，才算是「真的更新了」；如果這頁一開始
    // 就還沒有 SW 控制（例如第一次連上、或剛清過資料），那接下來的
    // controllerchange 只是「第一次接手」，不是版本更新，不用重整，
    // 不然一般换頁瀏覽也會被誤判成改版、多閃一次載入畫面。
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then((reg)=>{
      // 每次開啟都主動檢查一次，不然瀏覽器預設的背景檢查間隔可能長達
      // 24 小時——尤其是 TWA/APK 那種很少真的整個關掉重開的情況，
      // 使用者要等很久才會看到新版內容。新版接手後自動重新整理一次。
      reg.update();
      if(hadController){
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", ()=>{
          if(refreshing) return;
          refreshing = true;
          location.reload();
        });
      }
    }).catch(()=>{});
  });
}
</script>

<script>
(function(){
  const splashEl = document.getElementById("pwaSplash");
  if(!splashEl) return;
  const splashStartTime = performance.now();
  const hasSplashed = sessionStorage.getItem("sb_splashed_in_session") === "1";
  let splashTimer = null;

  if(!hasSplashed){
    splashEl.classList.add("pwa-splash-visible");
    sessionStorage.setItem("sb_splashed_in_session", "1");
  } else {
    splashTimer = setTimeout(()=>{
      if(splashEl) splashEl.classList.add("pwa-splash-visible");
    }, 300);
  }

  window.hidePwaSplash = function(){
    if(splashTimer) clearTimeout(splashTimer);
    if(!splashEl) return;
    splashEl.classList.add("pwa-splash-out");
    setTimeout(()=>{ if(splashEl.parentNode) splashEl.remove(); }, 200);
  };
  setTimeout(window.hidePwaSplash, 600);
})();
</script>

<script>
const SUPABASE_URL = "https://ofevarwtqzvzrvhbanmf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pWT6foelsonrb1sLMXhnCw_oA3ytvaX";

let shownCurrencies = JSON.parse(localStorage.getItem("splitbill-shown-currencies") || "null") || ["TWD"];
let showLeftMembers = localStorage.getItem("splitbill-show-left-members") !== "0";
function renderNavLinks(){
  renderSplitbillNav("navLinks", "SUMMARY", shownCurrencies);
}
renderNavLinks();

(function(){
  if(typeof window.supabase === "undefined"){
    if(typeof hidePwaSplash === "function") hidePwaSplash();
    const warn = document.getElementById("configWarning");
    if(warn){
      warn.innerHTML = "<h2>⚠️ 載入失敗</h2><p class='config-warning-text'>無法載入 Supabase SDK (cdn.jsdelivr.net)，請檢查網路連線或是否開啟了廣告阻擋套件。</p>";
      warn.classList.remove("hidden");
    }
    return;
  }

  if(!SUPABASE_URL || SUPABASE_URL.startsWith("YOUR_") || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith("YOUR_")){
    if(typeof hidePwaSplash === "function") hidePwaSplash();
    const warn = document.getElementById("configWarning");
    if(warn) warn.classList.remove("hidden");
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 帳密連結/解除連結 Google／Discord 失敗時的常見情況翻譯（登入本身已經搬去 index.html）。
  function friendlyAuthErr(error){
    const msg = (error && error.message) || "";
    if(/captcha/i.test(msg)) return "安全驗證失敗，請稍後再試一次";
    if(/already linked|already exists/i.test(msg)) return "這個帳號已經連結到另一個 Splitbill 帳號了，要先去那邊解除連結（或銷毀那個帳號）才能連過來這裡";
    return null;
  }

  // ---------- 所有 .msg 狀態訊息（成功/失敗提示）5 秒後自動消失 ----------
  // 用 MutationObserver 統一處理，不用每個 msg.textContent = "..." 的地方都手動加 setTimeout。
  (function(){
    const timers = new WeakMap();
    function scheduleClear(el){
      if(!el.textContent) return;
      if(timers.has(el)) clearTimeout(timers.get(el));
      timers.set(el, setTimeout(()=>{ el.textContent = ""; timers.delete(el); }, 5000));
    }
    new MutationObserver(muts=>{
      const seen = new Set();
      muts.forEach(m=>{
        let el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
        while(el && el !== document.body){
          if(el.classList && el.classList.contains("msg")){
            if(!seen.has(el)){ seen.add(el); scheduleClear(el); }
            break;
          }
          el = el.parentElement;
        }
      });
    }).observe(document.body, { childList: true, characterData: true, subtree: true });
  })();

  // ---------- 設定頁裡的 ⓘ 說明按鈕：點了才展開對應的說明文字 ----------
  document.addEventListener("click", (e)=>{
    const btn = e.target.closest(".info-btn");
    if(!btn) return;
    const target = document.getElementById(btn.dataset.infoFor);
    if(target) target.classList.toggle("hidden");
  });

  // ---------- 密碼欄位的小眼睛（顯示/隱藏密碼） ----------
  document.querySelectorAll(".pw-toggle-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const input = btn.closest(".pw-input-wrap").querySelector("input");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.textContent = show ? "🙈" : "👁️";
      btn.setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
    });
  });

  let currentUser = null;
  // myMember：目前登入的人在「目前啟用群組」裡對應的那一筆 members 資料。
  // members.id 不等於 auth 的 user id（一人可能同時屬於多個群組，每個群組各一筆
  // members 列），所有代表「我自己」的地方都要用 myMember.id，不能用 currentUser.id。
  let myMember = null;
  let memberRows = [];
  let memberById = {};

  function formatAmt(v){
    if(v === undefined || v === null || isNaN(v) || Math.abs(v) < 0.001) return "0";
    return Number(v).toLocaleString("zh-TW", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  const appScreen = document.getElementById("appScreen");

  // ---------- 成員名單：直接從 Supabase members 表讀取，改人不用改程式碼 ----------
  let MEMBERS = [];
  function isRealEmail(email){
    return !!email && !email.endsWith("@splitbill.local");
  }
  async function loadMembers(){
    let activeGroupId = null;
    if(currentUser){
      try {
        const { data: gid, error: gidError } = await sb.rpc("my_group_id");
        if(!gidError && gid) activeGroupId = gid;
      } catch(e){}

      // 如果 my_group_id 沒抓到，從 members 表查出此 user_id 的第一筆啟用群組
      if(!activeGroupId){
        try {
          const { data: userMembers } = await sb.from("members")
            .select("id,user_id,group_id,name,nickname,email,shown_currencies,left_at,account_deleted_at,groups(name)")
            .eq("user_id", currentUser.id)
            .is("left_at", null)
            .limit(1);
          if(userMembers && userMembers.length > 0){
            activeGroupId = userMembers[0].group_id;
            try { await sb.rpc("set_active_group", { p_group_id: activeGroupId }); } catch(e){}
          }
        } catch(e){}
      }
    }

    try {
      let query = sb.from("members").select("id,user_id,group_id,name,nickname,email,avatar_url,shown_currencies,left_at,account_deleted_at,groups(name)").order("name");
      if(activeGroupId) query = query.eq("group_id", activeGroupId);
      const { data, error } = await query;
      if(error){
        console.error("讀取群組成員失敗：", error);
        const { data: fallbackData } = await sb.from("members").select("id,user_id,group_id,name,nickname,email,avatar_url,shown_currencies,left_at,account_deleted_at,groups(name)").order("name");
        MEMBERS = fallbackData || [];
      } else {
        MEMBERS = data || [];
      }
    } catch(e){
      console.error("讀取 members 異常：", e);
      MEMBERS = [];
    }

    MEMBERS.forEach(m=>{
      if(m.avatar_url){
        localStorage.setItem("sb_avatar_" + m.id, m.avatar_url);
        if(m.user_id) localStorage.setItem("sb_avatar_" + m.user_id, m.avatar_url);
      } else {
        localStorage.removeItem("sb_avatar_" + m.id);
        if(m.user_id) localStorage.removeItem("sb_avatar_" + m.user_id);
      }
      m.accountName = m.name;
      if(m.nickname) m.name = m.nickname;
      if(m.account_deleted_at) m.name = m.name + " (銷毀)";
      else if(m.left_at) m.name = m.name + " (退出)";
    });
    memberById = {};
    MEMBERS.forEach(m => memberById[m.id] = m.name);
    myMember = currentUser ? (MEMBERS.find(m => m.user_id === currentUser.id && !m.left_at) || MEMBERS.find(m => m.user_id === currentUser.id)) : null;
    memberRows = showLeftMembers ? MEMBERS : MEMBERS.filter(m => !m.left_at);
  }

  // ---------- 12-hour auto-logout（滑動式：詳見 refreshLoginTime） ----------
  const LOGIN_TIME_KEY = "sb_login_time";
  const SESSION_DURATION_MS = 12 * 60 * 60 * 1000;
  function isSessionExpired(){
    const loginTime = Number(localStorage.getItem(LOGIN_TIME_KEY));
    if(!loginTime) return false;
    return (Date.now() - loginTime > SESSION_DURATION_MS);
  }
  // 滑動式：只要在 12 小時內有繼續使用，時間就往後推，不會單純因為
  // 帳號用得久就被踢出；真的超過 12 小時完全沒有任何動作才會被登出。
  function refreshLoginTime(){
    localStorage.setItem(LOGIN_TIME_KEY, String(Date.now()));
  }
  // 登入畫面已經搬去 index.html，這裡 session 一失效就直接導過去。
  async function forceLogout(){
    try{ await sb.auth.signOut(); }catch(e){}
    localStorage.removeItem(LOGIN_TIME_KEY);
    location.href = "index.html?redirect=summary.html";
  }
  setInterval(()=>{ if(isSessionExpired()) forceLogout(); else refreshLoginTime(); }, 5 * 60 * 1000);

  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    localStorage.removeItem(LOGIN_TIME_KEY);
    await sb.auth.signOut();
    location.href = "index.html";
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- 意見回饋：大家都看得到，只能刪自己寫的 ----------
  function formatFeedbackTime(iso){
    const d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleString("zh-TW", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
  }

  function paginationHTML(page, totalPages){
    if(totalPages <= 1) return "";
    return `<div class="pagination">
      <button type="button" class="btn secondary small pagination-prev" ${page <= 0 ? "disabled" : ""}>← 上一頁</button>
      <span class="pagination-info">第 ${page + 1} / ${totalPages} 頁</span>
      <button type="button" class="btn secondary small pagination-next" ${page >= totalPages - 1 ? "disabled" : ""}>下一頁 →</button>
    </div>`;
  }

  const FEEDBACK_PAGE_SIZE = 5;
  let cachedFeedback = [];
  let feedbackPage = 0;
  let editingFeedbackId = null;

  // 展開狀態下，留言內容高度會變（分頁、進入/離開編輯模式都會），
  // 每次重繪後都要重新量一次 #feedbackBody 的 max-height，
  // 不然編輯用的文字框跟儲存按鈕會被舊的高度裁掉、也沒辦法滑動看到。
  function syncFeedbackBodyHeight(){
    const body = document.getElementById("feedbackBody");
    if(body && body.classList.contains("open")){
      body.style.maxHeight = body.scrollHeight + "px";
    }
  }

  function renderFeedbackList(){
    const el = document.getElementById("feedbackList");
    const head = document.getElementById("feedbackToggleHead");
    if(!el) return;
    if(head) head.querySelector("span").textContent = `💭 查看留言（${cachedFeedback.length}）`;
    if(!cachedFeedback.length){
      el.innerHTML = `<p class="filter-hint">還沒有人留言，第一個說點什麼吧</p>`;
      syncFeedbackBodyHeight();
      return;
    }
    const totalPages = Math.ceil(cachedFeedback.length / FEEDBACK_PAGE_SIZE);
    if(feedbackPage >= totalPages) feedbackPage = totalPages - 1;
    if(feedbackPage < 0) feedbackPage = 0;
    const pageItems = cachedFeedback.slice(feedbackPage * FEEDBACK_PAGE_SIZE, (feedbackPage + 1) * FEEDBACK_PAGE_SIZE);

    el.innerHTML = pageItems.map(f=>{
      const canEdit = myMember && f.created_by === myMember.id;

      if(editingFeedbackId === f.id){
        return `<div class="exp-item">
          <div class="exp-main">
            <textarea class="fb-edit-input" rows="3">${escapeHtml(f.content)}</textarea>
            <div class="exp-actions fb-edit-actions">
              <button type="button" class="btn secondary small fb-save" data-id="${f.id}">儲存</button>
              <button type="button" class="btn secondary small fb-cancel">取消</button>
            </div>
          </div>
        </div>`;
      }

      return `<div class="exp-item">
        <div class="exp-main">
          <div class="exp-desc">${escapeHtml(f.content)}</div>
          <div class="exp-meta">${escapeHtml(memberById[f.created_by] || "?")} ・ ${formatFeedbackTime(f.created_at)}</div>
        </div>
        ${canEdit ? `<div class="exp-right"><div class="exp-actions"><button class="exp-edit fb-edit" data-id="${f.id}" title="編輯">✎</button><button class="exp-del fb-del" data-id="${f.id}" title="刪除">✕</button></div></div>` : ""}
      </div>`;
    }).join("") + paginationHTML(feedbackPage, totalPages);

    el.querySelectorAll(".fb-edit").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        editingFeedbackId = btn.dataset.id;
        renderFeedbackList();
      });
    });
    el.querySelectorAll(".fb-cancel").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        editingFeedbackId = null;
        renderFeedbackList();
      });
    });
    el.querySelectorAll(".fb-save").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const wrap = btn.closest(".exp-item");
        const newContent = wrap.querySelector(".fb-edit-input").value.trim();
        if(!newContent) return;
        const { error } = await sb.from("feedback").update({ content: newContent }).eq("id", btn.dataset.id);
        if(error){ await sbAlert("儲存失敗，請再試一次：" + error.message, "🔔 Splitbill 錯誤"); return; }
        editingFeedbackId = null;
        await loadFeedback();
      });
    });
    el.querySelectorAll(".fb-del").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const ok = await sbConfirm("確定要刪除這則留言嗎？");
        if(!ok) return;
        const { error } = await sb.from("feedback").delete().eq("id", btn.dataset.id);
        if(error){ await sbAlert("刪除失敗，請再試一次：" + error.message, "🔔 Splitbill 錯誤"); return; }
        await loadFeedback();
      });
    });
    const prevBtn = el.querySelector(".pagination-prev");
    if(prevBtn) prevBtn.addEventListener("click", ()=>{ feedbackPage--; renderFeedbackList(); });
    const nextBtn = el.querySelector(".pagination-next");
    if(nextBtn) nextBtn.addEventListener("click", ()=>{ feedbackPage++; renderFeedbackList(); });

    syncFeedbackBodyHeight();
  }

  async function loadFeedback(){
    const { data } = await sb.from("feedback").select("*").order("created_at", { ascending:false });
    cachedFeedback = data || [];
    renderFeedbackList();
  }

  const feedbackToggleHead = document.getElementById("feedbackToggleHead");
  if(feedbackToggleHead){

  function urlBase64ToUint8Array(base64String){
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
  }

  async function updateNotifyBtnState(){
    if(!notifyBtn) return;
    if(!pushSupported){
      notifyBtn.classList.add("hidden");
      return;
    }
    notifyBtn.classList.remove("hidden");
    notifyBtn.disabled = false;
    if(Notification.permission === "denied"){
      notifyBtn.textContent = "🔕";
      notifyBtn.title = "通知已被瀏覽器封鎖，點一下看怎麼打開";
      notifyBtn.classList.remove("active");
      if(notifyHint) notifyHint.textContent = NOTIFY_HINT_BLOCKED;
      return;
    }
    if(notifyHint) notifyHint.textContent = NOTIFY_HINT_DEFAULT;
    if(Notification.permission === "granted"){
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if(sub){
        notifyBtn.textContent = "🔔";
        notifyBtn.title = "通知已開啟（點擊關閉）";
        notifyBtn.classList.add("active");
        return;

  // 登入後自動嘗試訂閱（預設開啟）；如果瀏覽器已經封鎖或使用者已關閉過，
  // 這裡什麼都不會發生，不會硬跳出來吵。
  async function ensurePushSubscribed(){
    if(!pushSupported || !currentUser) return;
    if(Notification.permission === "denied"){ await updateNotifyBtnState(); return; }

    const permission = await Notification.requestPermission();
    if(permission !== "granted"){ await updateNotifyBtnState(); return; }

    try{
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      const subJson = sub.toJSON();
      const { error } = await sb.from("push_subscriptions").upsert({
        member_id: myMember.id,
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth
      }, { onConflict: "endpoint" });
      if(error){
        console.error("推播訂閱寫入失敗：", error);
        await sub.unsubscribe();
        await sbAlert("開啟通知失敗，請稍後再試一次。", "🔔 Splitbill 錯誤");
      }
    }catch(e){
      console.error("推播訂閱失敗：", e);
    }
    await updateNotifyBtnState();
  }

      return;
    }

    if(Notification.permission === "granted"){
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if(sub){
        const { error } = await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
        if(error) console.error("取消推播訂閱寫入失敗：", error);
        await sub.unsubscribe();
        await updateNotifyBtnState();
        return;
      }

    await ensurePushSubscribed();

  function notifyRelevantChange(table, payload){
    const row = (payload.new && Object.keys(payload.new).length) ? payload.new : payload.old;

    if(payload.eventType === "DELETE") return; // 刪除先不通知，避免太吵

    // 1. 如果是操作者本人自己的動作，不發送遠端即時廣播通知給自己（避免雙重通知）

  // 共用同一份邏輯，不會有算法不一致的風險。傳 sinceDate 可以只算某天之後的。
  // balances 的形狀： { 幣別代碼: { 成員id: 淨餘額 } }，幣別完全依 RPC 實際
  // 回傳的資料決定 ── 沒用過的幣別根本不會出現，總表跟我的款項都不用列出來。
  async function loadBalances(sinceDate){

  function currencyMeta(code){

  // ---------- 淨餘額比較：橫向長條圖，取代原本的文字總表。不同幣別數字
  // 不能混在一起比，所以用下拉選單一次只看一種。
  let balanceChartCode = null;
  let balanceChartData = null; // 存最新一次的 balances，切換幣別時不用重算

  // 用 canvas 量實際文字寬度，長條圖的名字欄寬度/長條可用長度才能跟著
  // 實際內容自動調整，不會被很長的名字或很大的金額數字擠壓、疊在一起。
  let measureCtx = null;
  function measureTextWidth(text, font){
    if(!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
    measureCtx.font = font;
    return measureCtx.measureText(text).width;
  }
  function truncateToWidth(text, font, maxWidth){
    if(measureTextWidth(text, font) <= maxWidth) return text;
    for(let len = text.length - 1; len > 0; len--){
      const candidate = text.slice(0, len) + "*";
      if(measureTextWidth(candidate, font) <= maxWidth) return candidate;
    }
    return "*";
  }

  function renderBalanceChart(){
    const wrap = document.getElementById("balanceChartWrap");
    if(!wrap || !balanceChartData) return;
    if(!balanceChartCode){
      wrap.innerHTML = `<p class="filter-hint">請到⚙️設定選擇要顯示的幣別</p>`;
      return;
    }
    const meta = currencyMeta(balanceChartCode);
    const rows = memberRows.map(m => ({
      name: m.name,
      amt: (balanceChartData[balanceChartCode] && balanceChartData[balanceChartCode][m.id]) || 0
    })).sort((a, b) => a.amt - b.amt);
    if(rows[0] && rows[0].amt < -0.05) rows[0].badge = "😠 ";
    if(rows.length > 1 && rows[rows.length - 1].amt > 0.05) rows[rows.length - 1].badge = "😢 ";

    if(!rows.length){
      wrap.innerHTML = `<p class="filter-hint">目前群組還沒有成員</p>`;
      return;
    }
    if(!rows.some(r => Math.abs(r.amt) > 0.05)){
      wrap.innerHTML = `<p class="filter-hint">${meta.label}目前大家都已結清 🎉</p>`;
      return;
    }

    // 名字欄寬度、長條可用長度都依實際內容（量測出來的文字寬度）自動調整，
    // 不用固定寬度——不然遇到很長的名字或很大的金額數字，文字會蓋到長條
    // 或彼此疊在一起。太長的名字超過欄寬上限就截斷加「…」，滑鼠移過去
    // （或桌機 title tooltip）還是看得到全名。
    const w = 320, rowH = 26, rowGap = 6, padTop = 6, padBottom = 6;
    const NAME_FONT = `11px "Noto Sans TC", sans-serif`;
    const AMT_FONT = `9px "JetBrains Mono", monospace`;

    const displayNames = rows.map(r => (r.badge || "") + r.name);
    const rawNameW = Math.max(...displayNames.map(t => measureTextWidth(t, NAME_FONT)));
    const labelW = Math.min(130, Math.max(60, rawNameW + 20));
    const truncatedNames = displayNames.map(t => truncateToWidth(t, NAME_FONT, labelW - 18));

    const barAreaW = w - labelW;
    const midX = labelW + barAreaW / 2;

    const amtLabels = rows.map(r => r.amt > 0.05 ? `+${meta.symbol}${formatAmt(r.amt)}` : r.amt < -0.05 ? `-${meta.symbol}${formatAmt(Math.abs(r.amt))}` : "已結清");
    const maxAmtW = Math.max(...amtLabels.map(t => measureTextWidth(t, AMT_FONT)));
    const halfMax = Math.max(20, Math.min(80, barAreaW / 2 - maxAmtW - 8));

    const max = Math.max(1, ...rows.map(r => Math.abs(r.amt)));
    const h = rows.length * (rowH + rowGap) - rowGap + padTop + padBottom;

    const bars = rows.map((r, i)=>{
      const y = padTop + i * (rowH + rowGap);
      const cy = y + rowH / 2;
      const barLen = Math.abs(r.amt) > 0.05 ? Math.max(3, Math.round((Math.abs(r.amt) / max) * halfMax)) : 0;
      const isPos = r.amt > 0.05;
      const barX = isPos ? midX : midX - barLen;
      const cls = isPos ? "flow-bar-down" : r.amt < -0.05 ? "flow-bar-up" : "";
      const barRect = barLen > 0
        ? `<rect x="${barX.toFixed(1)}" y="${(cy - 8).toFixed(1)}" width="${barLen}" height="16" rx="3" class="${cls}"></rect>`
        : "";
      const textX = isPos ? midX + barLen + 4 : midX - barLen - 4;
      const textAnchor = isPos ? "start" : "end";
      const textCls = isPos ? "balance-amt-pos" : r.amt < -0.05 ? "balance-amt-neg" : "";
      return `<text x="${(labelW - 14).toFixed(1)}" y="${(cy + 3.5).toFixed(1)}" text-anchor="end" class="balance-chart-name"><title>${escapeHtml(displayNames[i])}</title>${escapeHtml(truncatedNames[i])}</text>
        ${barRect}
        <text x="${textX.toFixed(1)}" y="${(cy + 3.5).toFixed(1)}" text-anchor="${textAnchor}" class="spend-bar-label ${textCls}">${amtLabels[i]}</text>`;
    }).join("");

    wrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="spend-chart" role="img" aria-label="淨餘額比較">
      <line x1="${midX.toFixed(1)}" y1="0" x2="${midX.toFixed(1)}" y2="${h}" class="flow-zero-line"/>
      ${bars}
    </svg>`;
  }

  // ---------- 主流程：確認登入狀態、沒有群組就導去 index.html ----------

      // 沒有任何啟用中的群組（例如在別的分頁退出了最後一個群組）：
      // 選擇/建立群組的畫面只做在 index.html，這裡直接導過去，
      // 帶著 redirect 記住回來要到總覽頁。
      if(!myMember){
        location.href = "index.html?redirect=summary.html";
        return;
      }

      if(!myMember.name && !isRealEmail(myMember.email)){
        // 讀得到成員資料列，但名字跟信箱都是空的——代表資料異常，
        // 與其卡在畫面上一堆轉圈圈，不如直接登出讓使用者重新登入。
        throw new Error("member data incomplete");
      }

      // 關鍵：從伺服器獲取即時 User 資料（包含其他裝置上傳的最新 avatar_url）
      let freshUser = user;
      try {
        const { data: freshData, error: freshErr } = await sb.auth.getUser();
        if(!freshErr && freshData && freshData.user){
          freshUser = freshData.user;
        }
      } catch(e){}

      user = freshUser;
      currentUser = freshUser;
      window.currentUser = freshUser;
      window.myMember = myMember;

      let myAvatar = "";
      if(myMember && myMember.avatar_url){
        myAvatar = myMember.avatar_url;
      } else if(user && user.user_metadata && user.user_metadata.avatar_url){
        myAvatar = user.user_metadata.avatar_url;
      }

      if(myMember){
        myMember.avatar_url = myAvatar;
        if(myAvatar){
          localStorage.setItem("sb_my_avatar", myAvatar);
          if(user && user.id) localStorage.setItem("sb_avatar_" + user.id, myAvatar);
          localStorage.setItem("sb_avatar_" + myMember.id, myAvatar);
          if(myMember.user_id) localStorage.setItem("sb_avatar_" + myMember.user_id, myAvatar);
        } else {
          localStorage.removeItem("sb_avatar_" + myMember.id);
          if(myMember.user_id) localStorage.removeItem("sb_avatar_" + myMember.user_id);
          if(user) localStorage.removeItem("sb_avatar_" + user.id);
          localStorage.removeItem("sb_my_avatar");
        }
      }

      {
        const whoamiEl = document.getElementById("whoamiName");
        const whoamiAvatarEl = document.getElementById("whoamiAvatar");
        const groupName = myMember.groups && myMember.groups.name;
        if(whoamiEl) whoamiEl.textContent = (myMember.name || user.email) + (groupName ? ` (${groupName})` : "");
        if(whoamiAvatarEl && myMember){
          whoamiAvatarEl.innerHTML = renderAvatarHTML(myMember, "avatar-md whoami-avatar");
        }
      }

      const myLatestRow = myMember;

      const emailReminderCard = document.getElementById("emailReminderCard");
      if(emailReminderCard){
        emailReminderCard.classList.toggle("hidden", !!(myLatestRow && isRealEmail(myLatestRow.email)));
      }

      shownCurrencies = (myLatestRow && myLatestRow.shown_currencies) || ["TWD"];
      localStorage.setItem("splitbill-shown-currencies", JSON.stringify(shownCurrencies));
      renderNavLinks();

      await loadAndRenderAllBalances();
      if(typeof hidePwaSplash === "function") hidePwaSplash();

      try { await loadFeedback(); } catch(e){ console.error("loadFeedback error:", e); }
      try { subscribeRealtime(); } catch(e){ console.error("subscribeRealtime error:", e); }
      try { ensurePushSubscribed(); } catch(e){ console.error("ensurePushSubscribed error:", e); }
    }catch(e){
      console.error("總覽頁載入異常：", e);
      if(typeof hidePwaSplash === "function") hidePwaSplash();
      if(!myMember){
        await forceLogout();
      }
    }
  }

  async function loadAndRenderAllBalances(){
    const allTime = await loadBalances(null);
    renderMyAmtList(allTime);

    balanceChartData = allTime;
    renderBalanceCurrencyMenu(activeCurrencyCodes());
    renderBalanceChart();
  }

  // ---------- 即時同步：別人新增/編輯/刪除支出或還款時，自動重新整理 ----------
  // 需要先在 Supabase 後台的 Database > Replication 把 expenses、repayments
  // 這兩張表加進 supabase_realtime publication，這段程式碼才收得到變動通知。
  let realtimeSubscribed = false;
  function subscribeRealtime(){
    if(realtimeSubscribed) return;
    realtimeSubscribed = true;

    let refreshTimer = null;
    function scheduleRefresh(){
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(()=>{ loadAndRenderAllBalances(); }, 400);
    }

    // filter 一定要帶 group_id，不然即時同步會把「所有群組」的異動都廣播過來，
    // 雖然畫面上會被 isRelevantToMe() 擋掉不顯示，但資料還是會傳到瀏覽器裡，
    // 等於別的群組的支出內容在網路層/記憶體裡洩漏出來，不是真的隔離。
    sb.channel("splitbill-overview")
      .on("postgres_changes", { event: "*", schema: "public", table: "expenses", filter: `group_id=eq.${myMember.group_id}` }, (payload)=>{
        notifyRelevantChange("expenses", payload);
        scheduleRefresh();
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "repayments", filter: `group_id=eq.${myMember.group_id}` }, (payload)=>{
        notifyRelevantChange("repayments", payload);
        scheduleRefresh();
      })
      .subscribe();
  }

  (async function boot(){
    try {
      const { data:{ session } } = await sb.auth.getSession();
      if(session && session.user){
        await onLoggedIn(session.user);
      } else {
        localStorage.removeItem(LOGIN_TIME_KEY);
        location.href = "index.html?redirect=summary.html";
      }
    } catch(e){
      location.href = "index.html?redirect=summary.html";
    }
  })();
})();
</script>
